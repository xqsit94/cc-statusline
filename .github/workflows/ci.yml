name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both, because the two things most likely to break are platform-specific:
    # gitinfo's upward walk and the XDG path resolution. Windows is absent
    # deliberately — PRD §13 defers it, and a red job for an unsupported
    # platform trains people to ignore red jobs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: race
        run: go test ./... -count=1 -race

      # PRD §9.3: "the command init writes executes under env -i". The status
      # line runs from a non-interactive shell with almost nothing set, and
      # that is the environment this asserts against.
      - name: render under env -i
        run: |
          go build -o /tmp/cc-statusline .
          echo '{"model":{"display_name":"Opus"}}' | env -i /tmp/cc-statusline render
          out=$(echo '{}' | env -i /tmp/cc-statusline render)
          test -n "$out" || { echo "::error::empty output under env -i"; exit 1; }

      # §3.3: nothing on stderr, exit 0, for every input including hostile ones.
      - name: failure contract
        run: |
          for input in '' '{}' 'null' 'not json at all' '[1,2,3]'; do
            err=$(printf '%s' "$input" | /tmp/cc-statusline render 2>&1 >/dev/null) || {
              echo "::error::non-zero exit for input: $input"; exit 1; }
            test -z "$err" || { echo "::error::stderr output for input: $input -> $err"; exit 1; }
          done

      - name: NO_COLOR emits no escapes
        run: |
          out=$(echo '{"model":{"display_name":"Opus"}}' | NO_COLOR=1 /tmp/cc-statusline render | cat -v)
          case "$out" in *'^['*) echo "::error::escapes under NO_COLOR: $out"; exit 1 ;; esac

      # The decidable half of §9.4's manual gate: ASCII purity, NO_COLOR ≡
      # --plain, nothing over budget at any width. It never renders to a screen,
      # so it does not substitute for the human pass — it stops the mechanical
      # half from rotting between passes, which is the half nobody re-checks.
      - name: visual gate — decidable checks
        run: make gate-check

  goreleaser-config:
    # Catches a broken .goreleaser.yaml at push time rather than at tag time,
    # when the fix costs a re-tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
