name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: install.sh against the release just published
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}" PREFIX="$RUNNER_TEMP/bin" sh ./install.sh
          "$RUNNER_TEMP/bin/cc-statusline" version
          echo '{"model":{"display_name":"Opus"}}' | "$RUNNER_TEMP/bin/cc-statusline" render
